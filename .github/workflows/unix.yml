name: macOS 与 Linux 构建

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 验证并构建 ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: 安装 Linux 桌面构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: 配置 Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          printf '[net]\n' > src-tauri/.cargo/config.toml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-rust-
      - name: 安装锁定依赖与内置运行时
        run: npm run setup
      - name: 验证版本与前端
        run: |
          node scripts/check-version.mjs
          npm test
          npm run build
      - name: Rust 测试与静态检查
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test --locked --lib --no-default-features
          cargo clippy --locked --lib --tests --no-default-features -- -D warnings
          cargo build --locked --example ui_fixture
      - name: 验证真实 Whistle 与进程生命周期
        run: |
          npm run test:contracts
          npm run test:lifecycle
      - name: 构建安装包
        run: npm run package
      - name: 收集安装包与校验文件
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} release/ \;
          node scripts/checksums.mjs
      - name: 上传安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

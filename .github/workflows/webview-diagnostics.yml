name: WebView2 启动诊断

on:
  workflow_dispatch:
    inputs:
      browser-arguments:
        description: 仅供诊断的附加 WebView2 参数
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-rust-
      - name: 确认缓存程序及运行环境
        run: |
          $exe = 'src-tauri/target/release/whistle-box.exe'
          if (-not (Test-Path $exe)) { throw '请先运行 Windows 构建以生成程序缓存。' }
          Write-Output "::notice title=缓存程序::SHA256 $((Get-FileHash $exe).Hash)，本流程只用于诊断，不作为发布验收。"
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run prepare-sidecar
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/ensure-webview2.ps1
      - name: 验证缓存程序
        timeout-minutes: 5
        env:
          WHISTLEBOX_TEST_BROWSER_ARGS: ${{ inputs.browser-arguments }}
        run: npm run test:webview
      - name: 保存诊断
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webview-diagnostics
          path: |
            test-results/
            .tooling/webview-fixture/*.log
          if-no-files-found: ignore

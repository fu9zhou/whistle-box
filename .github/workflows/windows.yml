name: Windows 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-dependencies:
    name: Rust 依赖公告检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 检查 RustSec 公告
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri
  dependencies:
    name: 依赖漏洞查询
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: 查询依赖公告
        run: |
          mkdir -p test-results
          npm audit --package-lock-only --json > test-results/npm-audit.json || true
          npm audit --prefix src-tauri/resources/whistle --package-lock-only --json > test-results/whistle-audit.json || true
          node scripts/check-audit.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit
          path: test-results/
  build:
    name: 验证并构建 Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: 配置 Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          Set-Content src-tauri/.cargo/config.toml '[net]'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: 安装锁定依赖与内置运行时
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run prepare-sidecar
      - name: 检查版本与前端
        run: |
          node scripts/check-version.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
      - name: Rust 格式、测试和静态检查
        working-directory: src-tauri
        run: |
          cargo fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --lib --no-default-features
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --lib --tests --no-default-features -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --example ui_fixture
      - name: 真实 Whistle 共存与浏览器验证
        run: |
          npm run test:contracts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:lifecycle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:browser
      - name: 构建中文安装包
        run: npm run package
      - name: WebView2 与 Windows 系统功能验证
        timeout-minutes: 5
        env:
          WHISTLEBOX_TEST_SYSTEM: '1'
        run: npm run test:webview
      - name: 安装、升级与卸载验证
        timeout-minutes: 10
        run: ./scripts/test-installer.ps1
      - name: 生成校验文件
        run: |
          Get-ChildItem release/*-setup.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - name: 上传安装包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error
      - name: 保存诊断截图和日志
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-results
          path: |
            test-results/
            .tooling/webview-fixture/*.log
          if-no-files-found: ignore
      - name: 保存 Rust 构建缓存
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}

  release:
    name: 发布发行版
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, dependencies, rust-dependencies]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: release
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "WhistleBox $RELEASE_TAG" --notes-file CHANGELOG.md
